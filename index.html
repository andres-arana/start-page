<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0d0d0d;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: rgba(255, 255, 255, 0.9);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    /* ── Clock ── */
    .clock #time {
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .clock #date {
      margin-top: 0.3rem;
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.03em;
    }

    /* ── Weather ── */
    .weather {
      text-align: right;
      text-decoration: none;
      color: inherit;
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 0.6rem;
    }

    .weather-temp {
      font-size: 3.75rem;
      font-weight: 300;
      line-height: 1;
    }

    .weather-condition {
      font-size: 1.35rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .weather-details {
      margin-top: 0.3rem;
      font-size: 1.17rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .weather-forecast {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.75rem;
      justify-content: flex-end;
    }

    .forecast-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .forecast-day .day-name {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .forecast-day .day-temp {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .forecast-day .day-cond {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.35);
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    /* ── Links ── */
    .links-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      max-width: 680px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.3rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .link-item img {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">

      <div class="clock">
        <div id="time"></div>
        <div id="date"></div>
      </div>

      <div class="weather" id="weather" style="display:none">
        <div class="weather-main">
          <span class="weather-temp" id="w-temp"></span>
          <span class="weather-condition" id="w-cond"></span>
        </div>
        <div class="weather-details" id="w-details"></div>
        <div class="weather-forecast" id="w-forecast"></div>
      </div>

    </div>

    <div class="links-section">
      <div class="links-grid">
        <!-- ── Edit links below ── -->
        <a class="link-item" href="https://github.com">
          <img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="">
          GitHub
        </a>
        <a class="link-item" href="https://mail.google.com">
          <img src="https://www.google.com/s2/favicons?domain=mail.google.com&sz=32" alt="">
          Gmail
        </a>
        <a class="link-item" href="https://calendar.google.com">
          <img src="https://www.google.com/s2/favicons?domain=calendar.google.com&sz=32" alt="">
          Calendar
        </a>
        <a class="link-item" href="https://youtube.com">
          <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=32" alt="">
          YouTube
        </a>
        <a class="link-item" href="https://reddit.com">
          <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32" alt="">
          Reddit
        </a>
        <!-- ── Add more links above this line ── -->
      </div>
    </div>
  </div>

  <script>
    // Background — date-seeded Picsum (same image all day)
    (function () {
      var d = new Date();
      var seed = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      document.body.style.backgroundImage =
        'url(https://picsum.photos/seed/' + seed + '/1920/1080)';
    })();

    // Clock
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = h + ':' + m;

      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
      document.getElementById('date').textContent =
        days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
    }
    updateClock();
    setInterval(updateClock, 60000);

    // Weather — WMO code → label
    var WMO = {
      0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
      45:'Fog', 48:'Icy fog',
      51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
      61:'Light rain', 63:'Rain', 65:'Heavy rain',
      71:'Light snow', 73:'Snow', 75:'Heavy snow',
      77:'Snow grains',
      80:'Rain showers', 81:'Rain showers', 82:'Heavy showers',
      85:'Snow showers', 86:'Heavy snow showers',
      95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Thunderstorm + hail'
    };

    function wmo(code) { return WMO[code] || ''; }

    function fetchWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=' + lat + '&longitude=' + lon +
        '&current=temperature_2m,apparent_temperature,weather_code' +
        '&daily=temperature_2m_max,temperature_2m_min,weather_code' +
        '&timezone=auto&forecast_days=4&temperature_unit=celsius';

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var c = data.current;
          var d = data.daily;

          document.getElementById('w-temp').textContent =
            Math.round(c.temperature_2m) + '°C';
          document.getElementById('w-cond').textContent =
            wmo(c.weather_code);
          document.getElementById('w-details').textContent =
            'Feels like ' + Math.round(c.apparent_temperature) + '°C  ·  ' +
            'H ' + Math.round(d.temperature_2m_max[0]) + '°  ' +
            'L ' + Math.round(d.temperature_2m_min[0]) + '°';

          var forecastEl = document.getElementById('w-forecast');
          var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          for (var i = 1; i <= 3; i++) {
            var date = new Date(d.time[i] + 'T12:00:00');
            var div = document.createElement('div');
            div.className = 'forecast-day';
            div.innerHTML =
              '<span class="day-name">' + dayNames[date.getDay()] + '</span>' +
              '<span class="day-temp">' +
                Math.round(d.temperature_2m_max[i]) + '° / ' +
                Math.round(d.temperature_2m_min[i]) + '°' +
              '</span>' +
              '<span class="day-cond">' + wmo(d.weather_code[i]) + '</span>';
            forecastEl.appendChild(div);
          }

          document.getElementById('weather').style.display = '';
        })
        .catch(function () {});
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { fetchWeather(pos.coords.latitude, pos.coords.longitude); },
        function () {}
      );
    }
  </script>
</body>
</html>
