<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #0d0d0d;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: rgba(255, 255, 255, 0.9);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem;
    }

    /* ── Top section ── */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 1rem;
    }

    /* ── Clock ── */
    #time {
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    #date {
      margin-top: 0.3rem;
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.03em;
    }

    /* ── Weather ── */
    .weather {
      text-align: center;
      margin-top: 1rem;
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .weather-temp {
      font-size: 3.75rem;
      font-weight: 300;
      line-height: 1;
    }

    .weather-condition {
      font-size: 1.35rem;
      color: rgba(255, 255, 255, 0.55);
    }

    .weather-details {
      margin-top: 0.3rem;
      font-size: 1.17rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .weather-forecast {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .forecast-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .forecast-day .day-name {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .forecast-day .day-temp {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .forecast-day .day-cond {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.35);
    }

    /* ── Links ── */
    .links-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      max-width: 680px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.3rem;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .link-item img {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-section">
      <div id="time"></div>
      <div id="date"></div>

      <div class="weather" id="weather" style="display:none">
        <div class="weather-main">
          <span class="weather-temp" id="w-temp"></span>
          <span class="weather-condition" id="w-cond"></span>
        </div>
        <div class="weather-details" id="w-details"></div>
        <div class="weather-forecast" id="w-forecast"></div>
      </div>
    </div>

    <div class="links-section">
      <div class="links-grid">
        <!-- ── Edit links below ── -->
        <a class="link-item" href="https://github.com">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 98 96'%3E%3Cpath fill='white' fill-rule='evenodd' clip-rule='evenodd' d='M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z'/%3E%3C/svg%3E" alt="">
          GitHub
        </a>
        <a class="link-item" href="https://web.whatsapp.com/">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2325D366'/%3E%3Cpath fill='white' d='M16 7C11 7 7 11 7 16c0 1.6.4 3.1 1.2 4.4L7 25l4.7-1.2C13 24.6 14.5 25 16 25c5 0 9-4 9-9s-4-9-9-9zm4.5 12.4c-.2.5-1.1 1-1.5 1.1-.4 0-.9.1-1.4-.1-.3-.1-.8-.2-1.3-.5-2.3-1-3.8-3.3-3.9-3.5-.1-.2-.9-1.3-.9-2.4 0-1.1.6-1.7.8-1.9.2-.2.5-.3.6-.3h.4c.1 0 .3-.1.5.4.2.5.7 1.6.7 1.7.1.1.1.3 0 .4-.1.2-.1.3-.3.4l-.3.4c-.1.1-.2.2-.1.5.1.2.6 1 1.3 1.6.9.8 1.6 1 1.9 1.1.2.1.4.1.5-.1.1-.2.6-.7.7-.9.2-.2.3-.2.5-.1.2.1 1.4.6 1.6.8.2.1.4.2.4.3.1.1.1.5-.1 1z'/%3E%3C/svg%3E" alt="">
          WhatsApp
        </a>
        <a class="link-item" href="https://web.telegram.org">
          <img src="https://www.google.com/s2/favicons?domain=web.telegram.org&sz=32" alt="">
          Telegram
        </a>
        <a class="link-item" href="https://mail.google.com">
          <img src="https://www.google.com/s2/favicons?domain=mail.google.com&sz=32" alt="">
          Gmail
        </a>
        <a class="link-item" href="https://calendar.google.com">
          <img src="https://www.google.com/s2/favicons?domain=calendar.google.com&sz=32" alt="">
          Calendar
        </a>
        <a class="link-item" href="https://youtube.com">
          <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=32" alt="">
          YouTube
        </a>
        <a class="link-item" href="https://reddit.com">
          <img src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32" alt="">
          Reddit
        </a>
        <!-- ── Add more links above this line ── -->
      </div>
    </div>
  </div>

  <script>
    // Background — date-seeded Picsum (same image all day)
    (function () {
      var d = new Date();
      var seed = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      document.body.style.backgroundImage =
        'url(https://picsum.photos/seed/' + seed + '/1920/1080)';
    })();

    // Clock
    function updateClock() {
      var now = new Date();
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = h + ':' + m;

      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
      document.getElementById('date').textContent =
        days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
    }
    updateClock();
    setInterval(updateClock, 60000);

    // Weather — WMO code → label
    var WMO = {
      0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
      45:'Fog', 48:'Icy fog',
      51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
      61:'Light rain', 63:'Rain', 65:'Heavy rain',
      71:'Light snow', 73:'Snow', 75:'Heavy snow',
      77:'Snow grains',
      80:'Rain showers', 81:'Rain showers', 82:'Heavy showers',
      85:'Snow showers', 86:'Heavy snow showers',
      95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Thunderstorm + hail'
    };

    var WMO_ICON = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌦️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'🌨️', 73:'🌨️', 75:'🌨️', 77:'🌨️',
      80:'🌦️', 81:'🌦️', 82:'🌧️',
      85:'🌨️', 86:'🌨️',
      95:'⛈️', 96:'⛈️', 99:'⛈️'
    };

    function wmo(code) { return WMO[code] || ''; }
    function wmoIcon(code) { return WMO_ICON[code] || '🌡️'; }

    function fetchWeather(lat, lon) {
      var url = 'https://api.open-meteo.com/v1/forecast' +
        '?latitude=' + lat + '&longitude=' + lon +
        '&current=temperature_2m,apparent_temperature,weather_code' +
        '&daily=temperature_2m_max,temperature_2m_min,weather_code' +
        '&timezone=auto&forecast_days=4&temperature_unit=celsius';

      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var c = data.current;
          var d = data.daily;

          document.getElementById('w-temp').textContent =
            Math.round(c.temperature_2m) + '°C';
          document.getElementById('w-cond').textContent =
            wmoIcon(c.weather_code) + ' ' + wmo(c.weather_code);
          document.getElementById('w-details').textContent =
            'Feels like ' + Math.round(c.apparent_temperature) + '°C  ·  ' +
            'H ' + Math.round(d.temperature_2m_max[0]) + '°  ' +
            'L ' + Math.round(d.temperature_2m_min[0]) + '°';

          var forecastEl = document.getElementById('w-forecast');
          var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          for (var i = 1; i <= 3; i++) {
            var date = new Date(d.time[i] + 'T12:00:00');
            var div = document.createElement('div');
            div.className = 'forecast-day';
            div.innerHTML =
              '<span class="day-name">' + dayNames[date.getDay()] + '</span>' +
              '<span style="font-size:1.4rem">' + wmoIcon(d.weather_code[i]) + '</span>' +
              '<span class="day-temp">' +
                Math.round(d.temperature_2m_max[i]) + '° / ' +
                Math.round(d.temperature_2m_min[i]) + '°' +
              '</span>' +
              '<span class="day-cond">' + wmo(d.weather_code[i]) + '</span>';
            forecastEl.appendChild(div);
          }

          document.getElementById('weather').style.display = '';
        })
        .catch(function () {});
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) { fetchWeather(pos.coords.latitude, pos.coords.longitude); },
        function () {}
      );
    }
  </script>
</body>
</html>
